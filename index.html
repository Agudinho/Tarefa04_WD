<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 04 - Web Design</title>
</head>
<body>
    <!--Conteúdo principal da página-->
    <main>

    <!--Tabela principal que organiza o conteúdo da atividade-->
    <table border = "1" width = "100%" >
        
        <!--Cabeçalho da tabela-->
        <thead>
            <tr>
                <th colspan = "4" style="text-align: center; background-color: lightgrey; text-decoration-color: black;">Aula 4 - Midias em HTML</th>
            </tr>
        </thead>

        <!--Corpo da tabela principal-->
        <tbody>


            <!-- Primeira linha de conteúdo -->
             <tr>
                <td style="vertical-align: top;">
                    <h3>Imagens</h3>

                    <img src = "imagem/imagem_cidade.jpg" alt = "Cidade" width = "150px" height = "100px">
                    <br>
                    <img src = "imagem/imagem_computador.jpg" alt = "Computador" width = "150px" height = "100px">
                    <br>
                    <img src = "imagem/imagem_natureza.jpg" alt = "Natureza" width = "150px" height = "100px">
                    <br>
                </td>

                <td style="vertical-align: top;">
                    <h3>Vídeo</h3>
                    <video src = "video/WebServices.mp4" controls width = "300px" height = "200px" poster = "imagem/WebServices.png">
                        Seu navegador não suporta vídeo.
                    </video>
                </td>

                <td style="vertical-align: top;">
                    <h3>Áudio</h3>
                    <audio controls>
                        <source src = "audio/reminiscence.mp3" type = "audio/mpeg">
                        <source src = "audio/reminiscence.ogg" type = "audio/ogg">
                        Seu navegador não suporta áudio.
                    </audio>
                </td>

                <td style="vertical-align: top;">
                    <h3>Formulário</h3>
                </td>
             </tr>

             <!-- Segunda linha de conteúdo -->
              <tr>
                <td style="vertical-align: top;">
                    <h3>Links</h3>
                </td>  

                <td style="vertical-align: top;">
                    <h3>Listas</h3>
                </td>

                <td style="vertical-align: top;">
                    <h3>Tabelas</h3>
                </td>

                <td style="vertical-align: top;">
                    <h3>Identificadores e Classes</h3>
                    <h3>Div Container</h3>
                </td>
              </tr>

            <tfoot>
              <tr>
                <td colspan="4">
                    <footer style="text-align: center; background-color: lightgrey; text-decoration-color: black;">&copy; 2026 - Atividade de HTML.</footer>
                </td>
              </tr>
            </tfoot>

        </tbody>
    </table>
    </main>

</body>

</html>
